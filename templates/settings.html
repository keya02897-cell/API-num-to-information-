{% extends 'base.html' %}{% block content %}<div class="page-head"><div><span class="badge">OWNER SETTINGS</span><h1>API Configuration</h1></div></div><form class="card settings" method="post"><h2>Plans</h2><div class="grid two"><label>Basic daily<input name="basic_daily" value="{{settings.basic_daily}}"></label><label>Basic days<input name="basic_days" value="{{settings.basic_days}}"></label><label>Pro daily<input name="pro_daily" value="{{settings.pro_daily}}"></label><label>Pro days<input name="pro_days" value="{{settings.pro_days}}"></label><label>Custom daily<input name="custom_daily" value="{{settings.custom_daily}}"></label><label>Custom days<input name="custom_days" value="{{settings.custom_days}}"></label></div><label>API URL<input name="api_url" value="{{settings.api_url}}"></label><label>Welcome Text<textarea name="welcome_text">{{settings.welcome_text}}</textarea></label><label>Support Text<textarea name="support_text">{{settings.support_text}}</textarea></label><label>How To<textarea name="howto_text">{{settings.howto_text}}</textarea></label><label>Docs Text<textarea name="docs_text">{{settings.docs_text}}</textarea></label><button class="btn">Save Settings</button></form>{% endblock %}
