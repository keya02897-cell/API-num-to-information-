<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
KRUTIK CYBER EXPERT API
</title>

<link
    rel="stylesheet"
    href="/static/style.css"
>

</head>

<body>

<div class="container">

    <div class="header">

        <div class="brand">
            KRUTIK CYBER EXPERT API
        </div>

        <h1>
            Number Search
        </h1>

        <p>
            Search authorized records
        </p>

    </div>


    <div class="search-box">

        <label>
            Enter Number(s)
        </label>

        <textarea
            id="numbers"
            placeholder="9876543210
9123456789
9988776655"
        ></textarea>

        <div class="hint">
            Multiple numbers:
            new line, space, comma or semicolon.
        </div>

        <button
            id="searchBtn"
            onclick="searchNumbers()"
        >
            SEARCH
        </button>

        <div
            id="status"
            class="status"
        ></div>

    </div>


    <div
        id="summary"
        class="summary"
    ></div>


    <div
        id="results"
        class="results"
    ></div>

</div>


<script>

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value === null ||
        value === undefined
            ? ""
            : String(value);

    return div.innerHTML;
}


function setStatus(
    message,
    type = ""
) {

    const status =
        document.getElementById(
            "status"
        );

    status.className =
        "status " + type;

    status.textContent =
        message;
}


async function readResponse(response) {

    /*
       FIX:
       Never blindly call response.json().
    */

    const text =
        await response.text();

    if (!text) {

        throw new Error(
            "Server returned an empty response."
        );
    }

    try {

        return JSON.parse(text);

    } catch (error) {

        console.error(
            "SERVER RESPONSE:",
            text
        );

        throw new Error(
            "Server returned invalid JSON."
        );
    }
}


async function searchNumbers() {

    const input =
        document.getElementById(
            "numbers"
        );

    const button =
        document.getElementById(
            "searchBtn"
        );

    const summary =
        document.getElementById(
            "summary"
        );

    const results =
        document.getElementById(
            "results"
        );

    const value =
        input.value.trim();


    if (!value) {

        setStatus(
            "Please enter number.",
            "error"
        );

        input.focus();

        return;
    }


    button.disabled = true;

    button.textContent =
        "SEARCHING...";

    summary.innerHTML = "";

    results.innerHTML = "";

    setStatus(
        "Searching...",
        "loading"
    );


    try {

        const response =
            await fetch(
                "/search",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",
                        "Accept":
                            "application/json"
                    },

                    body: JSON.stringify({
                        numbers: value
                    })
                }
            );


        const data =
            await readResponse(
                response
            );


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Search request failed."
            );
        }


        if (!data.ok) {

            throw new Error(
                data.message ||
                "Search failed."
            );
        }


        summary.innerHTML = `

            <div>
                Searched:
                <b>${escapeHTML(
                    data.searched
                )}</b>
            </div>

            <div>
                Found:
                <b>${escapeHTML(
                    data.found
                )}</b>
            </div>

        `;


        if (
            !Array.isArray(
                data.results
            )
        ) {

            throw new Error(
                "Invalid results received."
            );
        }


        if (
            data.results.length === 0
        ) {

            results.innerHTML = `

                <div class="empty">

                    <div class="icon">
                        🔎
                    </div>

                    <h2>
                        No Result Found
                    </h2>

                    <p>
                        No matching record found.
                    </p>

                </div>

            `;

            setStatus(
                "No result found.",
                "warning"
            );

            return;
        }


        setStatus(
            `${data.found} result(s) found.`,
            "success"
        );


        data.results.forEach(
            (record, index) => {

                let fields = "";

                Object.entries(
                    record
                ).forEach(
                    ([key, value]) => {

                        let displayValue;

                        if (
                            typeof value ===
                            "object" &&
                            value !== null
                        ) {

                            displayValue =
                                JSON.stringify(
                                    value
                                );

                        } else {

                            displayValue =
                                value ?? "";
                        }


                        fields += `

                            <div class="field">

                                <div class="field-key">
                                    ${escapeHTML(key)}
                                </div>

                                <div class="field-value">
                                    ${escapeHTML(
                                        displayValue
                                    )}
                                </div>

                            </div>

                        `;
                    }
                );


                results.insertAdjacentHTML(
                    "beforeend",

                    `

                    <div class="result-card">

                        <div class="result-title">
                            RESULT ${index + 1}
                        </div>

                        <div class="fields">
                            ${fields}
                        </div>

                    </div>

                    `
                );

            }
        );


    } catch (error) {

        console.error(
            "SEARCH ERROR:",
            error
        );

        setStatus(
            error.message ||
            "Something went wrong.",
            "error"
        );

    } finally {

        button.disabled = false;

        button.textContent =
            "SEARCH";
    }
}


document
    .getElementById("numbers")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.ctrlKey &&
                event.key === "Enter"
            ) {

                searchNumbers();
            }

        }
    );

</script>

</body>

</html>
