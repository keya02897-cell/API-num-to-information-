<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="KRUTIK CYBER EXPERT API Number Search"
    >

    <title>
        KRUTIK CYBER EXPERT API
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="container">

    <header>

        <div class="logo">
            KRUTIK CYBER EXPERT
        </div>

        <div class="sub-logo">
            API
        </div>

    </header>


    <main>

        <section class="hero">

            <h1>
                Number Search
            </h1>

            <p>
                Search one or multiple numbers instantly.
            </p>

        </section>


        <section class="search-box">

            <label for="numbers">
                Enter Number(s)
            </label>

            <textarea
                id="numbers"
                placeholder="Example:
9377711765
9812345674

You can also use comma or space."
            ></textarea>

            <button
                id="searchBtn"
                onclick="searchNumbers()"
            >
                <span id="btnText">
                    SEARCH
                </span>
            </button>

            <div
                id="message"
                class="message"
            ></div>

        </section>


        <section
            id="summary"
            class="summary hidden"
        >
        </section>


        <section
            id="results"
            class="results"
        >
        </section>

    </main>


    <footer>

        <div>
            KRUTIK CYBER EXPERT API
        </div>

        <div>
            Fast • Secure • Server Side Search
        </div>

    </footer>

</div>


<script>

async function searchNumbers() {

    const input =
        document.getElementById("numbers");

    const button =
        document.getElementById("searchBtn");

    const btnText =
        document.getElementById("btnText");

    const message =
        document.getElementById("message");

    const summary =
        document.getElementById("summary");

    const results =
        document.getElementById("results");


    const value =
        input.value.trim();


    message.innerHTML = "";

    summary.classList.add("hidden");

    results.innerHTML = "";


    if (!value) {

        message.innerHTML =
            "Please enter at least one number.";

        return;
    }


    button.disabled = true;

    btnText.innerText =
        "SEARCHING...";


    const startTime =
        performance.now();


    try {

        const response =
            await fetch("/search", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    numbers: value
                })

            });


        const data =
            await response.json();


        if (!response.ok || !data.ok) {

            throw new Error(
                data.error ||
                "Search failed."
            );
        }


        const endTime =
            performance.now();


        const time =
            ((endTime - startTime) / 1000)
            .toFixed(3);


        summary.classList.remove("hidden");

        summary.innerHTML = `
            <div>
                <strong>${data.searched}</strong>
                searched
            </div>

            <div>
                <strong>${data.found}</strong>
                found
            </div>

            <div>
                <strong>${time}s</strong>
                response
            </div>
        `;


        if (!data.results.length) {

            results.innerHTML = `
                <div class="empty">
                    No results found.
                </div>
            `;

            return;
        }


        data.results.forEach(item => {

            const card =
                document.createElement("div");

            card.className =
                "result-card";


            if (!item.found) {

                card.innerHTML = `
                    <div class="number">
                        ${escapeHtml(item.number)}
                    </div>

                    <div class="not-found">
                        No record found
                    </div>
                `;

                results.appendChild(card);

                return;
            }


            let html = `
                <div class="number">
                    ${escapeHtml(item.number)}
                </div>
            `;


            item.results.forEach(record => {

                html += `
                    <div class="record">
                `;


                Object.entries(record)
                    .forEach(([key, value]) => {

                        if (key === "_dataset") {
                            return;
                        }


                        html += `
                            <div class="field">

                                <div class="field-name">
                                    ${escapeHtml(key)}
                                </div>

                                <div class="field-value">
                                    ${escapeHtml(
                                        String(value ?? "")
                                    )}
                                </div>

                            </div>
                        `;

                    });


                html += `
                    </div>
                `;

            });


            card.innerHTML = html;

            results.appendChild(card);

        });


    } catch (error) {

        console.error(error);

        message.innerHTML =
            escapeHtml(
                error.message ||
                "Server error."
            );

    } finally {

        button.disabled = false;

        btnText.innerText =
            "SEARCH";

    }

}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


document
    .getElementById("numbers")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.ctrlKey &&
                event.key === "Enter"
            ) {

                searchNumbers();

            }

        }
    );

</script>

</body>
</html>
