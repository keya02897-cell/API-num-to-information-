{% extends 'base.html' %}{% block content %}<div class="page-head"><div><span class="badge">API PLANS</span><h1>Choose your access plan</h1><p>Requests are manually approved by the owner.</p></div></div><section class="grid plans">{% for id,name,daily,days in plans %}<article class="card"><div class="plan-name">{{name}}</div><h3>{{'{:,}'.format(daily)}}</h3><p>requests/day</p><p>{{days}} days</p><form method="post" action="{{url_for('request_access',plan=id)}}"><button class="btn full" type="submit">Request Access</button></form></article>{% endfor %}</section>{% endblock %}
